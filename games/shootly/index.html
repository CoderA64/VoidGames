<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shootly · VoidGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0c;
      --bg-surface: #131317;
      --bg-surface-hover: #1c1c22;
      --border: #24242c;
      --text-primary: #f4f4f6;
      --text-secondary: #8e8e98;
      --accent: #34d399;
      --bonus: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Cabecera Minimalista */
    header {
      width: 100%;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    .back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: #363642;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .stat-value.accent {
      color: var(--accent);
    }

    .combo-pill {
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: 99px;
      font-variant-numeric: tabular-nums;
      transition: transform 0.15s ease;
    }

    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="back-btn">← Volver</a>
    <div class="hud">
      <span class="combo-pill" id="combo">1x</span>
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Récord</span>
        <span class="stat-value accent" id="mscore">0</span>
      </div>
    </div>
  </header>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const mscoreEl = document.getElementById('mscore');
    const comboEl = document.getElementById('combo');

    const STORAGE_KEY = 'voidgames_mscore_shootly';
    let score = 0;
    let combo = 1;
    let mscore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    mscoreEl.textContent = mscore;

    let width, height;
    let targets = [];
    let ripples = [];
    let floatingTexts = [];
    let pointer = { x: -100, y: -100, active: false };
    let lastSpawn = 0;
    let spawnRate = 1150;
    let missFlash = 0;

    // Audio limpio y suave con rampa de ganancia (sin chasquidos)
    let audioCtx = null;
    function playTone(freqStart, freqEnd, duration, vol = 0.05) {
      if (localStorage.getItem('voidgames_music') === 'false') return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqStart, now);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnTarget() {
      const margin = 56;
      const isBonus = Math.random() < 0.16;
      const radius = isBonus ? 18 : 26;

      targets.push({
        x: margin + Math.random() * Math.max(20, width - margin * 2),
        y: margin + Math.random() * Math.max(20, height - margin * 2),
        r: radius,
        maxR: radius,
        shrinkSpeed: (isBonus ? 0.19 : 0.11) + Math.min(score * 0.0025, 0.18),
        isBonus,
        color: isBonus ? '#f43f5e' : '#34d399'
      });
    }

    function addRipple(x, y, color) {
      ripples.push({ x, y, r: 8, alpha: 0.7, color });
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, alpha: 1, color });
    }

    function resetRun() {
      if (score > 0 || combo > 1) {
        missFlash = 0.22;
        playTone(180, 75, 0.25, 0.07);
      }
      score = 0;
      combo = 1;
      spawnRate = 1150;
      targets = [];
      scoreEl.textContent = score;
      comboEl.textContent = '1x';
    }

    function shoot(x, y) {
      pointer.x = x;
      pointer.y = y;

      let hit = false;
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const dist = Math.hypot(x - t.x, y - t.y);

        if (dist <= t.r + 12) {
          targets.splice(i, 1);
          addRipple(t.x, t.y, t.color);

          const points = (t.isBonus ? 3 : 1) * combo;
          score += points;
          addFloatingText(`+${points}`, t.x, t.y - 10, t.color);

          combo = Math.min(combo + 1, 10);
          scoreEl.textContent = score;
          comboEl.textContent = `${combo}x`;

          if (score > mscore) {
            mscore = score;
            mscoreEl.textContent = mscore;
            localStorage.setItem(STORAGE_KEY, mscore);
          }

          spawnRate = Math.max(420, 1150 - score * 14);
          playTone(t.isBonus ? 740 : 520, t.isBonus ? 1100 : 780, 0.14, 0.05);
          hit = true;
          break;
        }
      }

      if (!hit) {
        resetRun();
      }
    }

    canvas.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') {
        const rect = canvas.getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
        pointer.active = true;
      }
    });

    canvas.addEventListener('pointerleave', () => {
      pointer.active = false;
    });

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      shoot(e.clientX - rect.left, e.clientY - rect.top);
    });

    function loop(timestamp) {
      // Fondo base
      ctx.fillStyle = '#0a0a0c';
      ctx.fillRect(0, 0, width, height);

      // Cuadrícula de puntos sutil de fondo
      ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
      const step = 36;
      for (let gx = step; gx < width; gx += step) {
        for (let gy = step; gy < height; gy += step) {
          ctx.fillRect(gx, gy, 1.5, 1.5);
        }
      }

      // Destello suave al fallar
      if (missFlash > 0.005) {
        ctx.fillStyle = `rgba(244, 63, 94, ${missFlash})`;
        ctx.fillRect(0, 0, width, height);
        missFlash *= 0.88;
      }

      // Aparición de objetivos
      if (timestamp - lastSpawn > spawnRate || targets.length === 0) {
        spawnTarget();
        lastSpawn = timestamp;
      }

      // Dibujar objetivos
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        t.r -= t.shrinkSpeed;

        if (t.r <= 4) {
          resetRun();
          break;
        }

        // Relleno translúcido suave
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fillStyle = t.isBonus ? 'rgba(244, 63, 94, 0.14)' : 'rgba(52, 211, 153, 0.12)';
        ctx.fill();

        // Aro exterior
        ctx.lineWidth = 2;
        ctx.strokeStyle = t.color;
        ctx.stroke();

        // Núcleo central
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = t.color;
        ctx.fill();
      }

      // Ondas de impacto (Ripples)
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 2.4;
        rp.alpha -= 0.035;
        if (rp.alpha <= 0) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = rp.alpha;
        ctx.strokeStyle = rp.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Textos flotantes de puntos
      ctx.font = '600 13px Inter, sans-serif';
      ctx.textAlign = 'center';
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.9;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // Mira minimalista en escritorio
      if (pointer.active) {
        ctx.strokeStyle = 'rgba(244, 244, 246, 0.35)';
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 14, 0, Math.PI * 2);
        ctx.stroke();
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
