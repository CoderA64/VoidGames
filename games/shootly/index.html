<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shootly · VoidGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0c;
      --bg-surface: #131317;
      --bg-surface-hover: #1c1c22;
      --border: #24242c;
      --text-primary: #f4f4f6;
      --text-secondary: #8e8e98;
      --accent: #34d399;
      --bonus: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    .back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: #363642;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .stat-value.accent {
      color: var(--accent);
    }

    .combo-pill {
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: 99px;
      font-variant-numeric: tabular-nums;
    }

    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
      cursor: pointer;
    }

    .controls-hint {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(19, 19, 23, 0.75);
      border: 1px solid var(--border);
      padding: 0.35rem 0.85rem;
      border-radius: 99px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="back-btn">← Volver</a>
    <div class="hud">
      <span class="combo-pill" id="combo">1x</span>
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Récord</span>
        <span class="stat-value accent" id="mscore">0</span>
      </div>
    </div>
  </header>

  <canvas id="game"></canvas>
  <div class="controls-hint">Toque, Clic, Espacio o Flechas para disparar</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const mscoreEl = document.getElementById('mscore');
    const comboEl = document.getElementById('combo');

    const STORAGE_KEY = 'voidgames_mscore_shootly';
    let score = 0;
    let combo = 1;
    let mscore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    mscoreEl.textContent = mscore;

    let width, height;
    let angleX = 0;
    let angleY = 0;
    let speedX = 0.03;
    let speedY = 0.02;
    let ripples = [];
    let floatingTexts = [];
    let missFlash = 0;
    let centerPulse = 0;

    let audioCtx = null;
    function playTone(freqStart, freqEnd, duration, vol = 0.05) {
      if (localStorage.getItem('voidgames_music') === 'false') return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqStart, now);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    function addRipple(x, y, color) {
      ripples.push({ x, y, r: 10, alpha: 0.8, color });
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, alpha: 1, color });
    }

    function resetRun() {
      missFlash = 0.25;
      playTone(160, 60, 0.28, 0.08);
      score = 0;
      combo = 1;
      speedX = 0.03;
      speedY = 0.02;
      scoreEl.textContent = score;
      comboEl.textContent = '1x';
    }

    function shoot() {
      const centerX = width / 2;
      const centerY = height / 2;
      const radiusX = Math.min(width, height) * 0.32;
      const radiusY = Math.min(width, height) * 0.24;

      const targetX = centerX + Math.sin(angleX) * radiusX;
      const targetY = centerY + Math.cos(angleY) * radiusY;

      // Distancia de la diana al centro exacto
      const distToCenter = Math.hypot(targetX - centerX, targetY - centerY);
      centerPulse = 1; // Pulso visual de disparo en la mira central

      if (distToCenter <= 35) {
        addRipple(targetX, targetY, '#34d399');
        
        const points = 1 * combo;
        score += points;
        addFloatingText(`+${points}`, targetX, targetY - 15, '#34d399');

        combo = Math.min(combo + 1, 15);
        scoreEl.textContent = score;
        comboEl.textContent = `${combo}x`;

        if (score > mscore) {
          mscore = score;
          mscoreEl.textContent = mscore;
          localStorage.setItem(STORAGE_KEY, mscore);
        }

        speedX += 0.0015;
        speedY += 0.0012;

        playTone(600, 950, 0.12, 0.05);
      } else {
        resetRun();
      }
    }

    // Disparo con ratón o toque táctil
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('header')) return;
      shoot();
    });

    // Disparo con cruceta/flechas del teclado, Espacio o Enter
    const triggerKeys = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
      'Space', 'Enter', 'KeyW', 'KeyA', 'KeyS', 'KeyD'
    ]);

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return; // Evita disparos accidentales al mantener pulsada la tecla
      if (triggerKeys.has(e.code)) {
        e.preventDefault();
        shoot();
      } else if (e.code === 'Escape') {
        window.location.href = '../../index.html';
      }
    });

    function loop() {
      ctx.fillStyle = '#0a0a0c';
      ctx.fillRect(0, 0, width, height);

      // Cuadrícula sutil de fondo
      ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
      const step = 36;
      for (let gx = step; gx < width; gx += step) {
        for (let gy = step; gy < height; gy += step) {
          ctx.fillRect(gx, gy, 1.5, 1.5);
        }
      }

      // Destello suave al fallar
      if (missFlash > 0.005) {
        ctx.fillStyle = `rgba(244, 63, 94, ${missFlash})`;
        ctx.fillRect(0, 0, width, height);
        missFlash *= 0.88;
      }

      const centerX = width / 2;
      const centerY = height / 2;
      const radiusX = Math.min(width, height) * 0.32;
      const radiusY = Math.min(width, height) * 0.24;

      angleX += speedX;
      angleY += speedY;

      const targetX = centerX + Math.sin(angleX) * radiusX;
      const targetY = centerY + Math.cos(angleY) * radiusY;

      // Mira fija central con pulso al disparar
      if (centerPulse > 0.01) centerPulse *= 0.85;
      const crosshairRadius = 28 + centerPulse * 6;

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = `rgba(244, 244, 246, ${0.25 + centerPulse * 0.4})`;
      ctx.beginPath();
      ctx.arc(centerX, centerY, crosshairRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(244, 244, 246, 0.4)';
      ctx.fill();

      // Diana móvil
      const distCenter = Math.hypot(targetX - centerX, targetY - centerY);
      const isClose = distCenter <= 35;

      ctx.beginPath();
      ctx.arc(targetX, targetY, 20, 0, Math.PI * 2);
      ctx.fillStyle = isClose ? 'rgba(52, 211, 153, 0.25)' : 'rgba(244, 244, 246, 0.08)';
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = isClose ? '#34d399' : '#f4f4f6';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(targetX, targetY, 4, 0, Math.PI * 2);
      ctx.fillStyle = isClose ? '#34d399' : '#f4f4f6';
      ctx.fill();

      // Ondas expansivas de impacto
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 2.2;
        rp.alpha -= 0.035;
        if (rp.alpha <= 0) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = rp.alpha;
        ctx.strokeStyle = rp.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Textos flotantes
      ctx.font = '600 13px Inter, sans-serif';
      ctx.textAlign = 'center';
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.9;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
  </html>
