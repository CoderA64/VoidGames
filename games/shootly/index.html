<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shootly - VoidGames</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --fg: #00ff41;
      --dim: #008f11;
      --accent: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: crosshair;
    }

    /* Filtro CRT Suave */
    body.crt-active::after {
      content: " ";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 99;
      opacity: 0.6;
    }

    body.crt-active { 
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.4); 
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 2px dashed var(--fg);
      font-weight: 700;
      z-index: 10;
      background: var(--bg);
    }

    a.back {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--fg);
      padding: 0.25rem 0.6rem;
      font-size: 0.85rem;
    }

    a.back:hover { background: var(--fg); color: var(--bg); }

    .scores { display: flex; gap: 1.5rem; font-size: 1rem; }

    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="back">← SALIR</a>
    <div class="scores">
      <span>COMBO: <span id="combo">1x</span></span>
      <span>SCORE: <span id="score">0</span></span>
      <span>M.SCORE: <span id="mscore">0</span></span>
    </div>
  </header>

  <canvas id="game"></canvas>

  <script>
    if (localStorage.getItem('voidgames_crt') !== 'false') {
      document.body.classList.add('crt-active');
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const mscoreEl = document.getElementById('mscore');
    const comboEl = document.getElementById('combo');

    const STORAGE_KEY = 'voidgames_mscore_shootly';
    let score = 0;
    let combo = 1;
    let mscore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    mscoreEl.textContent = mscore;

    let width, height;
    let targets = [];
    let particles = [];
    let floatingTexts = [];
    let pointer = { x: -100, y: -100 };
    let lastSpawn = 0;
    let spawnRate = 1100;
    let flashError = 0;
    let screenShake = 0;

    // Web Audio API para efectos de sonido arcade
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration, vol = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resize() {
      width = canvas.width = canvas.clientWidth;
      height = canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnTarget() {
      const margin = 60;
      // 15% de probabilidad de que aparezca un objetivo especial (más pequeño, da más puntos)
      const isBonus = Math.random() < 0.15;
      
      targets.push({
        x: margin + Math.random() * (width - margin * 2),
        y: margin + Math.random() * (height - margin * 2),
        r: isBonus ? 18 : 28,
        maxR: isBonus ? 18 : 28,
        shrinkSpeed: (isBonus ? 0.22 : 0.12) + Math.min(score * 0.003, 0.2),
        isBonus: isBonus,
        color: isBonus ? '#ff0055' : '#00ff41'
      });
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color: color
        });
      }
    }

    function addFloatingText(text, x, y) {
      floatingTexts.push({ text, x, y, life: 1 });
    }

    function resetRun() {
      combo = 1;
      comboEl.textContent = combo + 'x';
      score = 0;
      spawnRate = 1100;
      targets = [];
      flashError = 10;
      screenShake = 12;
      scoreEl.textContent = score;
      playSound(100, 'sawtooth', 0.3, 0.12);
    }

    function shoot(x, y) {
      pointer.x = x;
      pointer.y = y;

      let hit = false;
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const dist = Math.hypot(x - t.x, y - t.y);
        
        if (dist <= t.r + 12) {
          targets.splice(i, 1);
          addParticles(t.x, t.y, t.color);
          
          const pointsEarned = t.isBonus ? 3 * combo : 1 * combo;
          score += pointsEarned;
          addFloatingText(`+${pointsEarned}`, t.x, t.y);
          
          combo = Math.min(combo + 1, 10);
          comboEl.textContent = combo + 'x';
          scoreEl.textContent = score;

          if (score > mscore) {
            mscore = score;
            mscoreEl.textContent = mscore;
            localStorage.setItem(STORAGE_KEY, mscore);
          }

          spawnRate = Math.max(400, 1100 - score * 15);
          playSound(t.isBonus ? 880 : 580, 'square', 0.12);
          hit = true;
          break;
        }
      }

      if (!hit) {
        resetRun();
      }
    }

    canvas.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
    });

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      shoot(e.clientX - rect.left, e.clientY - rect.top);
    });

    function loop(timestamp) {
      ctx.save();

      // Aplicar efecto de sacudida (Screen Shake) si hubo fallo
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
        screenShake *= 0.85;
      }

      ctx.fillStyle = flashError > 0 ? '#1a0005' : '#000000';
      if (flashError > 0) flashError--;
      ctx.fillRect(0, 0, width, height);

      // Generar objetivos
      if (timestamp - lastSpawn > spawnRate || targets.length === 0) {
        spawnTarget();
        lastSpawn = timestamp;
      }

      // Actualizar y dibujar objetivos
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        t.r -= t.shrinkSpeed;

        if (t.r <= 3) {
          resetRun();
          break;
        }

        ctx.strokeStyle = t.color;
        ctx.fillStyle = t.color;
        ctx.lineWidth = t.isBonus ? 3 : 2;

        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Dibujar partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      // Dibujar textos flotantes de puntuación
      ctx.font = 'bold 14px Inter';
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 1;
        ft.life -= 0.03;
        if (ft.life <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(0, 255, 65, ${ft.life})`;
        ctx.fillText(ft.text, ft.x, ft.y);
      }

      // Mira en pantalla
      if (pointer.x > 0 && pointer.y > 0) {
        ctx.strokeStyle = 'rgba(0, 255, 65, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 14, 0, Math.PI * 2);
        ctx.moveTo(pointer.x - 20, pointer.y);
        ctx.lineTo(pointer.x + 20, pointer.y);
        ctx.moveTo(pointer.x, pointer.y - 20);
        ctx.lineTo(pointer.x, pointer.y + 20);
        ctx.stroke();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
