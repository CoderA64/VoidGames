<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blocks · VoidGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0c;
      --bg-surface: #131317;
      --bg-surface-hover: #1c1c22;
      --border: #24242c;
      --text-primary: #f4f4f6;
      --text-secondary: #8e8e98;
      --accent: #34d399;
      --danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      padding: 0.9rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    .back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: #363642;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.accent {
      color: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1rem;
      gap: 0.75rem;
    }

    .game-layout {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .board-frame {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.5rem;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    canvas#board {
      display: block;
      border-radius: 8px;
      touch-action: none;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 88px;
    }

    .panel-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .panel-title {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    canvas#next {
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0.5rem;
      border-radius: 8px;
      background: rgba(10, 10, 12, 0.86);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      text-align: center;
      padding: 1rem;
    }

    .overlay.visible {
      display: flex;
    }

    .overlay h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .overlay p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .btn {
      background: var(--accent);
      color: #051b11;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 1.1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.97); }

    /* Controles táctiles para móvil */
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      width: 100%;
      max-width: 340px;
    }

    .pad-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 0.65rem 0;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .pad-btn:active {
      background: var(--bg-surface-hover);
      border-color: var(--accent);
    }

    .controls-hint {
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    @media (hover: hover) and (pointer: fine) {
      .touch-controls { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="back-btn">← Volver</a>
    <div class="hud">
      <div class="stat">
        <span class="stat-label">Líneas</span>
        <span class="stat-value" id="lines">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Récord</span>
        <span class="stat-value accent" id="mscore">0</span>
      </div>
    </div>
  </header>

  <main>
    <div class="game-layout">
      <div class="board-frame">
        <canvas id="board"></canvas>
        <div class="overlay" id="gameover-overlay">
          <h2>Fin de partida</h2>
          <p id="final-summary">Score: 0</p>
          <button class="btn" id="restart-btn">Jugar de nuevo</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="panel-box">
          <span class="panel-title">Siguiente</span>
          <canvas id="next"></canvas>
        </div>
        <div class="panel-box">
          <span class="panel-title">Nivel</span>
          <span class="stat-value" id="level">1</span>
        </div>
      </div>
    </div>

    <div class="touch-controls">
      <button class="pad-btn" id="btn-left" aria-label="Izquierda">←</button>
      <button class="pad-btn" id="btn-rotate" aria-label="Rotar">↻</button>
      <button class="pad-btn" id="btn-down" aria-label="Bajar">↓</button>
      <button class="pad-btn" id="btn-right" aria-label="Derecha">→</button>
    </div>

    <div class="controls-hint">← → Mover · ↑ / W Rotar · ↓ Bajar · Espacio Caída directa</div>
  </main>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const STORAGE_KEY = 'voidgames_mscore_blocks';

    const SHAPES = [
      { matrix: [[1, 1, 1, 1]], color: '#34d399' },                 // I
      { matrix: [[1, 1], [1, 1]], color: '#fbbf24' },                 // O
      { matrix: [[0, 1, 0], [1, 1, 1]], color: '#a78bfa' },         // T
      { matrix: [[1, 0, 0], [1, 1, 1]], color: '#60a5fa' },         // J
      { matrix: [[0, 0, 1], [1, 1, 1]], color: '#fb923c' },         // L
      { matrix: [[0, 1, 1], [1, 1, 0]], color: '#2dd4bf' },         // S
      { matrix: [[1, 1, 0], [0, 1, 1]], color: '#f43f5e' }          // Z
    ];

    const boardCanvas = document.getElementById('board');
    const boardCtx = boardCanvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const mscoreEl = document.getElementById('mscore');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const overlayEl = document.getElementById('gameover-overlay');
    const finalSummaryEl = document.getElementById('final-summary');

    let cellSize = 24;
    let grid = [];
    let current = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let level = 1;
    let mscore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    let gameOver = false;
    let dropCounter = 0;
    let lastTime = 0;

    mscoreEl.textContent = mscore;

    // Audio limpio con rampa de ganancia (respeta voidgames_music)
    let audioCtx = null;
    function playTone(freqStart, freqEnd, duration, vol = 0.045) {
      if (localStorage.getItem('voidgames_music') === 'false') return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqStart, now);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function resizeCanvases() {
      const availHeight = window.innerHeight - (window.innerWidth < 768 ? 225 : 135);
      const availWidth = window.innerWidth - 145;
      cellSize = Math.max(16, Math.min(30, Math.floor(Math.min(availHeight / ROWS, availWidth / COLS))));

      const dpr = window.devicePixelRatio || 1;
      boardCanvas.style.width = `${COLS * cellSize}px`;
      boardCanvas.style.height = `${ROWS * cellSize}px`;
      boardCanvas.width = COLS * cellSize * dpr;
      boardCanvas.height = ROWS * cellSize * dpr;
      boardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const nextSize = Math.max(14, Math.floor(cellSize * 0.72));
      nextCanvas.style.width = `${4 * nextSize}px`;
      nextCanvas.style.height = `${4 * nextSize}px`;
      nextCanvas.width = 4 * nextSize * dpr;
      nextCanvas.height = 4 * nextSize * dpr;
      nextCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function createEmptyGrid() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function randomPiece() {
      const template = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const matrix = template.matrix.map(row => [...row]);
      return {
        matrix,
        color: template.color,
        x: Math.floor((COLS - matrix[0].length) / 2),
        y: 0
      };
    }

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          rotated[c][rows - 1 - r] = matrix[r][c];
        }
      }
      return rotated;
    }

    function collides(piece, offsetX = 0, offsetY = 0, testMatrix = piece.matrix) {
      for (let r = 0; r < testMatrix.length; r++) {
        for (let c = 0; c < testMatrix[r].length; c++) {
          if (!testMatrix[r][c]) continue;
          const newX = piece.x + c + offsetX;
          const newY = piece.y + r + offsetY;
          if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
          if (newY >= 0 && grid[newY][newX]) return true;
        }
      }
      return false;
    }

    function mergePiece() {
      for (let r = 0; r < current.matrix.length; r++) {
        for (let c = 0; c < current.matrix[r].length; c++) {
          if (current.matrix[r][c]) {
            const gy = current.y + r;
            const gx = current.x + c;
            if (gy >= 0 && gy < ROWS && gx >= 0 && gx < COLS) {
              grid[gy][gx] = current.color;
            }
          }
        }
      }
    }

    function addScore(points) {
      score += points;
      scoreEl.textContent = score;
      if (score > mscore) {
        mscore = score;
        mscoreEl.textContent = mscore;
        localStorage.setItem(STORAGE_KEY, mscore);
      }
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(cell => cell !== null)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(null));
          cleared++;
          r++;
        }
      }

      if (cleared > 0) {
        const linePoints = [0, 100, 300, 500, 800];
        addScore((linePoints[cleared] || cleared * 200) * level);
        lines += cleared;
        linesEl.textContent = lines;
        level = Math.floor(lines / 10) + 1;
        levelEl.textContent = level;
        playTone(540, 880, 0.16, 0.055);
      }
    }

    function spawnNext() {
      current = nextPiece || randomPiece();
      nextPiece = randomPiece();
      if (collides(current, 0, 0)) {
        gameOver = true;
        finalSummaryEl.textContent = `Score: ${score} · Líneas: ${lines}`;
        overlayEl.classList.add('visible');
        playTone(220, 85, 0.3, 0.07);
      }
    }

    function moveHorizontal(dir) {
      if (gameOver) return;
      if (!collides(current, dir, 0)) {
        current.x += dir;
        playTone(320, 360, 0.045, 0.025);
      }
    }

    function rotatePiece() {
      if (gameOver) return;
      const rotated = rotateMatrix(current.matrix);
      // Pequeño wall-kick para facilitar rotaciones cerca de bordes
      const kicks = [0, -1, 1, -2, 2];
      for (const offset of kicks) {
        if (!collides(current, offset, 0, rotated)) {
          current.matrix = rotated;
          current.x += offset;
          playTone(440, 580, 0.06, 0.035);
          return;
        }
      }
    }

    function stepDown(manual = false) {
      if (gameOver) return;
      if (!collides(current, 0, 1)) {
        current.y++;
        if (manual) addScore(1);
      } else {
        mergePiece();
        clearLines();
        spawnNext();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (gameOver) return;
      let dropped = 0;
      while (!collides(current, 0, 1)) {
        current.y++;
        dropped++;
      }
      if (dropped > 0) addScore(dropped * 2);
      mergePiece();
      clearLines();
      spawnNext();
      dropCounter = 0;
      playTone(480, 220, 0.09, 0.045);
    }

    function getGhostY() {
      let gy = current.y;
      while (!collides(current, 0, gy - current.y + 1)) {
        gy++;
      }
      return gy;
    }

    function drawCell(ctx, x, y, size, color, alpha = 1, ghost = false) {
      const pad = 1.5;
      const w = size - pad * 2;
      const px = x * size + pad;
      const py = y * size + pad;

      ctx.save();
      ctx.globalAlpha = alpha;
      if (ghost) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 0.5, py + 0.5, w - 1, w - 1);
      } else {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(px, py, w, w, 4);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBoard() {
      boardCtx.fillStyle = '#0a0a0c';
      boardCtx.fillRect(0, 0, COLS * cellSize, ROWS * cellSize);

      // Cuadrícula sutil
      boardCtx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      boardCtx.lineWidth = 1;
      for (let c = 1; c < COLS; c++) {
        boardCtx.beginPath();
        boardCtx.moveTo(c * cellSize, 0);
        boardCtx.lineTo(c * cellSize, ROWS * cellSize);
        boardCtx.stroke();
      }
      for (let r = 1; r < ROWS; r++) {
        boardCtx.beginPath();
        boardCtx.moveTo(0, r * cellSize);
        boardCtx.lineTo(COLS * cellSize, r * cellSize);
        boardCtx.stroke();
      }

      // Piezas fijadas
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            drawCell(boardCtx, c, r, cellSize, grid[r][c], 0.92);
          }
        }
      }

      if (current && !gameOver) {
        // Fantasma de caída
        const ghostY = getGhostY();
        for (let r = 0; r < current.matrix.length; r++) {
          for (let c = 0; c < current.matrix[r].length; c++) {
            if (current.matrix[r][c]) {
              drawCell(boardCtx, current.x + c, ghostY + r, cellSize, current.color, 0.35, true);
            }
          }
        }

        // Pieza activa
        for (let r = 0; r < current.matrix.length; r++) {
          for (let c = 0; c < current.matrix[r].length; c++) {
            if (current.matrix[r][c]) {
              drawCell(boardCtx, current.x + c, current.y + r, cellSize, current.color, 1);
            }
          }
        }
      }

      // Vista previa de la siguiente pieza
      const nextSize = Math.max(14, Math.floor(cellSize * 0.72));
      nextCtx.clearRect(0, 0, 4 * nextSize, 4 * nextSize);
      if (nextPiece) {
        const offsetX = (4 - nextPiece.matrix[0].length) / 2;
        const offsetY = (4 - nextPiece.matrix.length) / 2;
        for (let r = 0; r < nextPiece.matrix.length; r++) {
          for (let c = 0; c < nextPiece.matrix[r].length; c++) {
            if (nextPiece.matrix[r][c]) {
              drawCell(nextCtx, offsetX + c, offsetY + r, nextSize, nextPiece.color, 0.95);
            }
          }
        }
      }
    }

    function getDropInterval() {
      return Math.max(120, 800 - (level - 1) * 65);
    }

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;

      if (!gameOver) {
        dropCounter += delta;
        if (dropCounter >= getDropInterval()) {
          stepDown(false);
        }
      }

      drawBoard();
      requestAnimationFrame(update);
    }

    function startNewGame() {
      grid = createEmptyGrid();
      score = 0;
      lines = 0;
      level = 1;
      gameOver = false;
      dropCounter = 0;
      scoreEl.textContent = 0;
      linesEl.textContent = 0;
      levelEl.textContent = 1;
      overlayEl.classList.remove('visible');
      nextPiece = randomPiece();
      spawnNext();
    }

    // Teclado
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        window.location.href = '../../index.html';
        return;
      }
      if (gameOver && (e.code === 'Enter' || e.code === 'Space')) {
        e.preventDefault();
        startNewGame();
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        e.preventDefault();
        moveHorizontal(-1);
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        e.preventDefault();
        moveHorizontal(1);
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        e.preventDefault();
        stepDown(true);
      } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        rotatePiece();
      } else if (e.code === 'Space') {
        e.preventDefault();
        hardDrop();
      }
    });

    // Botones táctiles en móvil
    document.getElementById('btn-left').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      moveHorizontal(-1);
    });
    document.getElementById('btn-right').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      moveHorizontal(1);
    });
    document.getElementById('btn-down').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      stepDown(true);
    });
    document.getElementById('btn-rotate').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      rotatePiece();
    });
    document.getElementById('restart-btn').addEventListener('click', startNewGa
