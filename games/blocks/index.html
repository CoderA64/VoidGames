<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blocks · VoidGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0c;
      --bg-surface: #131317;
      --bg-surface-hover: #1c1c22;
      --border: #24242c;
      --text-primary: #f4f4f6;
      --text-secondary: #8e8e98;
      --accent: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 520px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .back-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .scores {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .scores span span {
      color: var(--accent);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 520px;
      padding: 0.75rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .board-wrap {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.45rem;
    }

    canvas {
      display: block;
      background: var(--bg-base);
      border-radius: 6px;
    }

    .gameover {
      position: absolute;
      inset: 0.45rem;
      background: rgba(10, 10, 12, 0.88);
      border-radius: 6px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .gameover.show {
      display: flex;
    }

    .gameover p {
      font-size: 1rem;
      font-weight: 700;
    }

    .btn {
      background: var(--accent);
      color: #051b11;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 1rem;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .controls {
      width: 100%;
      max-width: 300px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .pad {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 0.7rem 0;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pad:active {
      background: var(--bg-surface-hover);
      border-color: var(--accent);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
    }

    @media (hover: hover) and (pointer: fine) {
      .controls { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="back-btn">← Volver</a>
    <div class="scores">
      <div>SCORE: <span id="score">0</span></div>
      <div>M.SCORE: <span id="mscore">0</span></div>
    </div>
  </header>

  <main>
    <div class="board-wrap">
      <canvas id="game"></canvas>
      <div class="gameover" id="gameover">
        <p>Fin de partida</p>
        <button class="btn" id="retry">Reiniciar</button>
      </div>
    </div>

    <div class="controls">
      <button class="pad" id="p-left">←</button>
      <button class="pad" id="p-rot">↻</button>
      <button class="pad" id="p-down">↓</button>
      <button class="pad" id="p-right">→</button>
    </div>

    <p class="hint">Flechas / WASD para mover y rotar · Espacio para bajar</p>
  </main>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const CELL = window.innerWidth < 420 ? 19 : 22;
    const STORAGE_KEY = 'voidgames_mscore_blocks';

    const PIECES = [
      { m: [[1, 1, 1, 1]], c: '#34d399' },
      { m: [[1, 1], [1, 1]], c: '#fbbf24' },
      { m: [[0, 1, 0], [1, 1, 1]], c: '#a78bfa' },
      { m: [[1, 0, 0], [1, 1, 1]], c: '#60a5fa' },
      { m: [[0, 0, 1], [1, 1, 1]], c: '#fb923c' },
      { m: [[1, 1, 0], [0, 1, 1]], c: '#f43f5e' },
      { m: [[0, 1, 1], [1, 1, 0]], c: '#2dd4bf' }
    ];

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;

    const scoreEl = document.getElementById('score');
    const mscoreEl = document.getElementById('mscore');
    const gameoverEl = document.getElementById('gameover');

    let board = [];
    let piece = null;
    let score = 0;
    let mscore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    let over = false;
    let lastDrop = 0;
    mscoreEl.textContent = mscore;

    function newBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function spawnPiece() {
      const p = PIECES[Math.floor(Math.random() * PIECES.length)];
      piece = {
        m: p.m.map(r => [...r]),
        c: p.c,
        x: Math.floor((COLS - p.m[0].length) / 2),
        y: 0
      };
      if (hit(piece.x, piece.y, piece.m)) {
        over = true;
        gameoverEl.classList.add('show');
      }
    }

    function hit(nx, ny, m) {
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (!m[r][c]) continue;
          const x = nx + c;
          const y = ny + r;
          if (x < 0 || x >= COLS || y >= ROWS) return true;
          if (y >= 0 && board[y][x]) return true;
        }
      }
      return false;
    }

    function rotate(m) {
      return m[0].map((_, i) => m.map(row => row[i]).reverse());
    }

    function lock() {
      for (let r = 0; r < piece.m.length; r++) {
        for (let c = 0; c < piece.m[r].length; c++) {
          if (piece.m[r][c] && piece.y + r >= 0) {
            board[piece.y + r][piece.x + c] = piece.c;
          }
        }
      }

      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(null));
          cleared++;
          r++;
        }
      }

      if (cleared > 0) {
        score += cleared * 100;
        scoreEl.textContent = score;
        if (score > mscore) {
          mscore = score;
          mscoreEl.textContent = mscore;
          localStorage.setItem(STORAGE_KEY, mscore);
        }
      }

      spawnPiece();
    }

    function move(dx) {
      if (!over && !hit(piece.x + dx, piece.y, piece.m)) piece.x += dx;
    }

    function turn() {
      if (over) return;
      const rot = rotate(piece.m);
      if (!hit(piece.x, piece.y, rot)) piece.m = rot;
    }

    function drop() {
      if (over) return;
      if (!hit(piece.x, piece.y + 1, piece.m)) {
        piece.y++;
      } else {
        lock();
      }
    }

    function slam() {
      if (over) return;
      while (!hit(piece.x, piece.y + 1, piece.m)) piece.y++;
      lock();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.strokeStyle = 'rgba(255,255,255,0.03)';
          ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
          if (board[r][c]) {
            ctx.fillStyle = board[r][c];
            ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
          }
        }
      }

      if (piece && !over) {
        ctx.fillStyle = piece.c;
        for (let r = 0; r < piece.m.length; r++) {
          for (let c = 0; c < piece.m[r].length; c++) {
            if (piece.m[r][c]) {
              ctx.fillRect((piece.x + c) * CELL + 1, (piece.y + r) * CELL + 1, CELL - 2, CELL - 2);
            }
          }
        }
      }
    }

    function loop(now = 0) {
      if (!over && now - lastDrop > 650) {
        drop();
        lastDrop = now;
      }
      draw();
      requestAnimationFrame(loop);
    }

    function reset() {
      board = newBoard();
      score = 0;
      over = false;
      scoreEl.textContent = 0;
      gameoverEl.classList.remove('show');
      spawnPiece();
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); move(-1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); move(1); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); drop(); }
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); turn(); }
      else if (e.code === 'Space') { e.preventDefault(); slam(); }
      else if (e.code === 'Escape') { window.location.href = '../../index.html'; }
    });

    document.getElementById('p-left').onclick = () => move(-1);
    document.getElementById('p-right').onclick = () => move(1);
    document.getElementById('p-down').onclick = () => drop();
    document.getElementById('p-rot').onclick = () => turn();
    document.getElementById('retry').onclick = reset;

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
