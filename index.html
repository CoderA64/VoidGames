<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoidGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0c;
      --bg-surface: #131317;
      --bg-surface-hover: #1c1c22;
      --border: #24242c;
      --text-primary: #f4f4f6;
      --text-secondary: #8e8e98;
      --accent: #AD2831;
      --accent-hover: #c4303a;
      --accent-dim: rgba(173, 40, 49, 0.18);
      --accent-soft-text: #f87171;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .icon-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .game-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover {
      background: var(--bg-surface-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .game-card:active {
      transform: translateY(0);
    }

    .game-info h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
      letter-spacing: -0.01em;
    }

    .game-info p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .play-pill {
      background: var(--accent-dim);
      color: var(--accent-soft-text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 99px;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      margin-left: 1rem;
    }

    .game-card:hover .play-pill {
      background: var(--accent);
      color: #ffffff;
    }

    footer {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal.open {
      display: flex;
      opacity: 1;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h3 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .setting-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-desc {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
    }

    .switch-btn {
      background: #24242c;
      border: none;
      width: 48px;
      height: 26px;
      border-radius: 99px;
      position: relative;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    .switch-btn::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .switch-btn.active {
      background: var(--accent);
    }

    .switch-btn.active::after {
      transform: translateX(22px);
      background: #ffffff;
    }

    .welcome-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .welcome-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .welcome-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-base);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--bg-surface-hover);
    }

    .btn.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .score-badge {
      font-weight: 600;
      color: var(--accent-soft-text);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Modal Bienvenida -->
  <div class="modal" id="modal-welcome">
    <div class="modal-box">
      <h3 class="welcome-title">Bienvenido a VoidGames</h3>
      <p class="welcome-text">¿Deseas activar el sonido ambiental minimalista mientras exploras el catálogo?</p>
      <div class="welcome-actions">
        <button class="btn" id="welcome-no">Silenciar</button>
        <button class="btn primary" id="welcome-yes">Activar</button>
      </div>
    </div>
  </div>

  <!-- Cabecera -->
  <header>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes" title="Ajustes">⚙</button>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>VoidGames</span>
    </div>
    <button class="icon-btn" id="btn-records" aria-label="Récords" title="Récords (High Scores)">★</button>
  </header>

  <!-- Catálogo -->
  <main>
    <div class="game-grid" id="game-list">
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Cargando catálogo...</p>
    </div>
  </main>

  <!-- Pie -->
  <footer>
    Licencia AGPL v3 · Modo Offline Disponible
  </footer>

  <!-- Modal Ajustes -->
  <div class="modal" id="modal-settings">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Ajustes</h3>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <div class="setting-row">
        <div>
          <span>Audio Ambiental</span>
          <span class="setting-desc">Sintetizador suave en el menú</span>
        </div>
        <button class="switch-btn" id="toggle-music" aria-label="Alternar audio"></button>
      </div>
    </div>
  </div>

  <!-- Modal Récords -->
  <div class="modal" id="modal-records">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Mejores Puntuaciones</h3>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <div id="records-list"></div>
    </div>
  </div>

  <script>
    let gamesData = [];
    let audioCtx = null;
    let musicInterval = null;
    const notes = [261.63, 329.63, 392.00, 493.88, 392.00, 329.63];
    let step = 0;

    const musicBtn = document.getElementById('toggle-music');

    function parseTomlGames(text) {
      const blocks = text.split('[[games]]').slice(1);
      return blocks.map(block => {
        const game = {};
        block.split('\n').forEach(line => {
          const match = line.match(/^\s*([a-zA-Z0-9_]+)\s*=\s*"(.*)"\s*$/);
          if (match) game[match[1]] = match[2];
        });
        return game;
      }).filter(g => g.id && g.path);
    }

    async function loadGames() {
      const container = document.getElementById('game-list');
      try {
        const res = await fetch('games.toml');
        const text = await res.text();
        gamesData = parseTomlGames(text);

        container.innerHTML = '';
        gamesData.forEach(game => {
          const best = localStorage.getItem(`voidgames_mscore_${game.id}`);
          const scoreSub = best ? ` · Récord: ${best}` : '';

          const a = document.createElement('a');
          a.href = game.path;
          a.className = 'game-card';
          a.innerHTML = `
            <div class="game-info">
              <h2>${game.title}</h2>
              <p>${game.description || ''}${scoreSub}</p>
            </div>
            <span class="play-pill">Jugar</span>
          `;
          container.appendChild(a);
        });
      } catch (e) {
        container.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.9rem;">No se pudo cargar games.toml. Ejecuta desde un servidor local.</p>';
      }
    }

    function playAmbientNote() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);

      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.025, audioCtx.currentTime + 0.6);
      gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 1.9);
      step++;
    }

    function startMusic() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!musicInterval) {
        playAmbientNote();
        musicInterval = setInterval(playAmbientNote, 1600);
      }
      musicBtn.classList.add('active');
      localStorage.setItem('voidgames_music', 'true');
    }

    function stopMusic() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
      musicBtn.classList.remove('active');
      localStorage.setItem('voidgames_music', 'false');
    }

    musicBtn.addEventListener('click', () => {
      if (!musicInterval) {
        startMusic();
      } else {
        stopMusic();
      }
    });

    const isConfigured = localStorage.getItem('voidgames_configured');
    const modalWelcome = document.getElementById('modal-welcome');

    if (!isConfigured) {
      modalWelcome.classList.add('open');
    } else if (localStorage.getItem('voidgames_music') === 'true') {
      musicBtn.classList.add('active');
      const enableOnInteraction = () => {
        if (localStorage.getItem('voidgames_music') === 'true' && !musicInterval) {
          startMusic();
        }
        window.removeEventListener('pointerdown', enableOnInteraction);
      };
      window.addEventListener('pointerdown', enableOnInteraction);
    }

    document.getElementById('welcome-yes').addEventListener('click', () => {
      localStorage.setItem('voidgames_configured', 'true');
      startMusic();
      modalWelcome.classList.remove('open');
    });

    document.getElementById('welcome-no').addEventListener('click', () => {
      localStorage.setItem('voidgames_configured', 'true');
      stopMusic();
      modalWelcome.classList.remove('open');
    });

    document.getElementById('btn-settings').onclick = () => {
      document.getElementById('modal-settings').classList.add('open');
    };

    document.getElementById('btn-records').onclick = () => {
      const list = document.getElementById('records-list');
      list.innerHTML = gamesData.map(g => {
        const best = localStorage.getItem(`voidgames_mscore_${g.id}`) || 0;
        return `
          <div class="setting-row">
            <span>${g.title}</span>
            <span class="score-badge">${best} pts</span>
          </div>
        `;
      }).join('') || '<p style="color: var(--text-secondary); font-size: 0.9rem;">Sin juegos registrados.</p>';
      document.getElementById('modal-records').classList.add('open');
    };

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
    }

    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal && modal.id !== 'modal-welcome') {
          closeModals();
        }
      });
    });

    loadGames();
  </script>
</body>
  </html>
